<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location — OpenStreetMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0e14; }
  #map { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const params = new URLSearchParams(location.search);
let lat = parseFloat(params.get('lat')) || 64.18;
let lon = parseFloat(params.get('lon')) || -51.72;
const zoom = parseInt(params.get('z')) || 14;

const map = L.map('map').setView([lat, lon], zoom);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const marker = L.marker([lat, lon]).addTo(map);
marker.bindPopup(`${lat.toFixed(5)}, ${lon.toFixed(5)}`);

// Listen for position updates from the parent window
window.addEventListener('message', e => {
  if (e.data && typeof e.data.lat === 'number' && typeof e.data.lon === 'number') {
    lat = e.data.lat;
    lon = e.data.lon;
    marker.setLatLng([lat, lon]);
    marker.setPopupContent(`${lat.toFixed(5)}, ${lon.toFixed(5)}`);
    map.setView([lat, lon]);
  }
});

// Tell parent we're ready
if (window.parent !== window) {
  window.parent.postMessage({ ready: true, source: 'osm' }, '*');
}
</script>
</body>
</html>
