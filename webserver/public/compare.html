<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile Compare — ours vs Google</title>
<style>
  body {
    margin: 0; background: #0a1018; color: #dbe5f1;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: rgba(255,255,255,0.05); border-bottom: 1px solid #1e2d3a;
    flex-wrap: wrap;
  }
  #bar b { color: #5af; }
  input {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 4px 8px; font: inherit; outline: none; width: 150px;
  }
  button {
    background: #1a3a5a; border: 1px solid #2a5a8a; border-radius: 4px; color: #5af;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  button:hover { background: #224a72; }
  #meta { color: #6889a8; }
  #panes { display: flex; gap: 8px; padding: 12px; justify-content: center; }
  .pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pane .label { text-align: center; color: #6889a8; }
  .pane .label b { color: #dbe5f1; }
  .imgbox {
    position: relative; background: #060a10; border: 1px solid #1e2d3a;
    width: min(23.5vw, calc(100vh - 130px)); aspect-ratio: 1;
  }
  select {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 2px 4px; font: inherit; outline: none;
  }
  .imgbox img { width: 100%; height: 100%; display: block; image-rendering: auto; }
  .imgbox .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6889a8; pointer-events: none;
  }
  #help { padding: 4px 14px 14px; color: #44607c; text-align: center; }
  kbd {
    background: #16222e; border: 1px solid #2a3a4a; border-radius: 3px;
    padding: 0 5px; color: #8fb0cc;
  }
</style>
</head>
<body>
<div id="bar">
  <b>tile compare</b>
  <input id="tile-input" placeholder="tile id e.g. 14-5511-3145" spellcheck="false">
  <button id="go">Go</button>
  <button id="up" title="parent tile ([)">&minus; depth</button>
  <button id="down" title="child tile (])">+ depth</button>
  <button id="refresh" title="re-fetch Google imagery, bypassing cache">refresh google</button>
  <span id="meta"></span>
</div>
<div id="panes">
  <div class="pane">
    <div class="label"><b>ours</b> <span id="ours-info"></span></div>
    <div class="imgbox"><img id="ours-img" alt=""><div class="status" id="ours-status"></div></div>
  </div>
  <div class="pane">
    <div class="label"><b>google</b> <span id="goog-info"></span></div>
    <div class="imgbox"><img id="goog-img" alt=""><div class="status" id="goog-status"></div></div>
  </div>
  <div class="pane">
    <div class="label"><b>terrain</b>
      <select id="chan-select">
        <option value="southness" selected>southness</option>
        <option value="sun">sun</option>
        <option value="slope">slope</option>
        <option value="elev">elev</option>
      </select>
      <span id="chan-info"></span>
    </div>
    <div class="imgbox"><img id="chan-img" alt=""><div class="status" id="chan-status"></div></div>
  </div>
  <div class="pane">
    <div class="label"><b>classes</b>
      <select id="cls-select">
        <option value="refined" selected>refined</option>
        <option value="field">field</option>
        <option value="bands">bands</option>
      </select>
      <span id="cls-info"></span>
    </div>
    <div class="imgbox"><img id="cls-img" alt=""><div class="status" id="cls-status"></div></div>
  </div>
</div>
<div id="help">
  <kbd>&larr;&uarr;&darr;&rarr;</kbd> neighbor tiles &nbsp; <kbd>[</kbd>/<kbd>]</kbd> depth up/down
  &nbsp; hold <kbd>space</kbd> to blink google over ours (alignment)
  &nbsp; hold <kbd>s</kbd> to blink the terrain channel over google (aspect/sun sanity)
  &nbsp; hold <kbd>c</kbd> to blink classes over google (label sanity)
</div>
<script>
const GOOGLE_RES = 512;
let depth = 0, col = 0, row = 0;
let blinkSaved = null;
let chanBlinkSaved = null;
let clsBlinkSaved = null;

const $ = id => document.getElementById(id);

function tileId() { return `${depth}-${col}-${row}`; }

function parseTile(str) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(str.trim());
  if (!m) return false;
  depth = +m[1]; col = +m[2]; row = +m[3];
  return true;
}

async function loadInto(imgEl, statusEl, infoEl, url, headerNames) {
  statusEl.textContent = 'loading…';
  imgEl.style.opacity = 0.35;
  try {
    const resp = await fetch(url);
    if (!resp.ok || resp.status === 202) {
      imgEl.removeAttribute('src');
      statusEl.textContent = resp.status === 202 ? 'fetching upstream — retry shortly'
        : `HTTP ${resp.status} ${resp.headers.get('X-Tex-Status') || ''}`;
      infoEl.textContent = '';
      return;
    }
    const blob = await resp.blob();
    if (imgEl.dataset.blobUrl) URL.revokeObjectURL(imgEl.dataset.blobUrl);
    imgEl.dataset.blobUrl = URL.createObjectURL(blob);
    imgEl.src = imgEl.dataset.blobUrl;
    imgEl.style.opacity = 1;
    statusEl.textContent = '';
    infoEl.textContent = headerNames
      .map(h => { const v = resp.headers.get(h); return v ? `${h.replace('X-', '').toLowerCase()}=${v}` : null; })
      .filter(Boolean).join(' ');
  } catch (err) {
    statusEl.textContent = String(err);
  }
}

function load(refreshGoogle) {
  const tid = tileId();
  $('tile-input').value = tid;
  const url = new URL(location);
  url.searchParams.set('tile', tid);
  history.replaceState(null, '', url);
  // depth-d tile spans WORLD_EXTENT/2^d meters; show m/px vs the 512px google render
  $('meta').textContent = `depth ${depth}`;
  loadInto($('ours-img'), $('ours-status'), $('ours-info'),
    `/api/texture/${tid}.jpg`, ['X-Tex-Source', 'X-Tex-Quality']);
  loadInto($('goog-img'), $('goog-status'), $('goog-info'),
    `/api/google/${tid}.jpg?res=${GOOGLE_RES}${refreshGoogle ? '&refresh=1' : ''}`,
    ['X-Google-Zoom']);
  loadInto($('chan-img'), $('chan-status'), $('chan-info'),
    `/api/channel/${tid}/${$('chan-select').value}.png?res=${GOOGLE_RES}`, []);
  loadInto($('cls-img'), $('cls-status'), $('cls-info'),
    `/api/classes/${tid}/${$('cls-select').value}.png?res=${GOOGLE_RES}`, []);
}

$('go').addEventListener('click', () => { if (parseTile($('tile-input').value)) load(); });
$('tile-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('go').click();
  e.stopPropagation();
});
$('refresh').addEventListener('click', () => load(true));
$('chan-select').addEventListener('change', () => load());
$('chan-select').addEventListener('keydown', e => e.stopPropagation());
$('cls-select').addEventListener('change', () => load());
$('cls-select').addEventListener('keydown', e => e.stopPropagation());
$('up').addEventListener('click', () => {
  if (depth > 0) { depth--; col >>= 1; row >>= 1; load(); }
});
$('down').addEventListener('click', () => { depth++; col *= 2; row *= 2; load(); });

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  // grid row increases northward (same convention as the tile ancestor math)
  if (e.key === 'ArrowUp') { row++; load(); }
  else if (e.key === 'ArrowDown') { row--; load(); }
  else if (e.key === 'ArrowLeft') { col--; load(); }
  else if (e.key === 'ArrowRight') { col++; load(); }
  else if (e.key === '[') $('up').click();
  else if (e.key === ']') $('down').click();
  else if (e.key === ' ') {
    e.preventDefault();
    if (blinkSaved === null && $('goog-img').src) {
      blinkSaved = $('ours-img').src;
      $('ours-img').src = $('goog-img').src;
    }
  } else if (e.key === 's') {
    if (chanBlinkSaved === null && $('chan-img').src) {
      chanBlinkSaved = $('goog-img').src;
      $('goog-img').src = $('chan-img').src;
    }
  } else if (e.key === 'c') {
    if (clsBlinkSaved === null && $('cls-img').src) {
      clsBlinkSaved = $('goog-img').src;
      $('goog-img').src = $('cls-img').src;
    }
  } else return;
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (e.key === ' ' && blinkSaved !== null) {
    $('ours-img').src = blinkSaved;
    blinkSaved = null;
  } else if (e.key === 's' && chanBlinkSaved !== null) {
    $('goog-img').src = chanBlinkSaved;
    chanBlinkSaved = null;
  } else if (e.key === 'c' && clsBlinkSaved !== null) {
    $('goog-img').src = clsBlinkSaved;
    clsBlinkSaved = null;
  }
});

const start = new URLSearchParams(location.search).get('tile') || '14-5511-3145';
if (parseTile(start)) load(); else { parseTile('14-5511-3145'); load(); }
</script>
</body>
</html>
