<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile Inspector</title>
<style>
  body {
    margin: 0; background: #0a1018; color: #dbe5f1;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: rgba(255,255,255,0.05); border-bottom: 1px solid #1e2d3a;
    flex-wrap: wrap;
  }
  #bar b { color: #5af; }
  input {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 4px 8px; font: inherit; outline: none; width: 150px;
  }
  button {
    background: #1a3a5a; border: 1px solid #2a5a8a; border-radius: 4px; color: #5af;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  button:hover { background: #224a72; }
  select {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 2px 4px; font: inherit; outline: none;
  }
  #meta { color: #6889a8; }
  /* One shared grid: every stage contributes cells to the SAME rows
     (1 title / 2 image / 3 legend / 4 status / 5 description), so the
     images stay on one line no matter how long any description runs.
     The stage wrapper uses display:contents; explicit grid-column comes
     from the generated markup. */
  #flow {
    display: grid; gap: 5px 4px; padding: 12px;
    justify-content: center; align-items: start;
  }
  .stage { display: contents; }
  .stage .name {
    grid-row: 1; text-align: center; color: #dbe5f1; font-weight: bold;
    align-self: end; white-space: nowrap;
  }
  .stage .what {
    grid-row: 5; text-align: center; color: #44607c; font-size: 12px;
    line-height: 1.3;
  }
  .imgbox {
    grid-row: 2; position: relative; background: #060a10;
    border: 1px solid #1e2d3a;
    width: min(15vw, calc(100vh - 230px)); aspect-ratio: 1;
  }
  .imgbox img { width: 100%; height: 100%; display: block; }
  .imgbox .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6889a8; text-align: center; padding: 8px; pointer-events: none;
  }
  .stage .info {
    grid-row: 4; text-align: center; color: #8fb0cc; font-size: 12px;
    line-height: 1.35; word-break: break-word;
  }
  .legend {
    grid-row: 3; display: flex; flex-wrap: wrap; gap: 3px 10px;
    justify-content: center; color: #8fb0cc; font-size: 12px;
  }
  .key-item { display: flex; align-items: center; gap: 5px; }
  .key-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .info .ok { color: #4cc38a; }
  .info .bad { color: #e5484d; }
  .arrow { grid-row: 2; align-self: center; color: #2a5a8a; font-size: 22px; padding: 0 2px; }
  #help { padding: 4px 14px 14px; color: #44607c; text-align: center; }
  kbd {
    background: #16222e; border: 1px solid #2a3a4a; border-radius: 3px;
    padding: 0 5px; color: #8fb0cc;
  }
</style>
</head>
<body>
<div id="bar">
  <b>tile inspector</b>
  <input id="tile-input" placeholder="tile id e.g. 12-1373-784" spellcheck="false">
  <button id="go">Go</button>
  <button id="up" title="parent tile ([)">&minus; depth</button>
  <button id="down" title="child tile (])">+ depth</button>
  <span id="meta"></span>
</div>
<div id="flow"></div>
<div id="help">
  <kbd>&larr;&uarr;&darr;&rarr;</kbd> neighbor tiles &nbsp; <kbd>[</kbd>/<kbd>]</kbd> depth up/down
</div>
<script>
const RES = 512;
let depth = 0, col = 0, row = 0;
const $ = id => document.getElementById(id);

// The pipeline, in order. Each stage: what it is, where its image comes from,
// and how to describe its status from /api/pipeline/<tid>.json.
const STAGES = [
  {
    key: 'heightmap', name: '1 heightmap',
    what: 'ArcticDEM 10 m (Copernicus 30 m fallback), fetched on demand into terrain.db',
    img: tid => `/api/channel/${tid}/elev.png?res=${RES}`,
    info: m => m.heightmap.ok
      ? `<span class="ok">cached</span> · ${m.heightmap.source || '?'}`
      : '<span class="bad">missing — fly here to fetch</span>'
  },
  {
    key: 'channels', name: '2 DEM channels',
    what: 'derived straight from the heightmap, pixel-aligned with the texture. southness: red = south-facing, blue = north (nothing lives on the blue side). slope: steepness, brighter = steeper. sun: hillshade preview.',
    select: ['southness', 'slope', 'sun'],
    img: (tid, chan) => `/api/channel/${tid}/${chan || 'southness'}.png?res=${RES}`,
    info: m => m.heightmap.ok
      ? '<span class="ok">derived on the fly</span>'
      : '<span class="bad">needs the heightmap</span>'
  },
  {
    key: 'texture', name: '3 texture',
    what: 'Dataforsyningen SPOT/aerial ortho — real imagery through d12 only. Deeper tiles show a derived enlarge of their parent (flagged red in the status line): synthetic, never mistake it for genuine coverage.',
    img: tid => `/api/texture/${tid}.jpg`,
    info: m => {
      if (!m.texture.ok) return '<span class="bad">not fetched yet</span>';
      const synthetic = m.texture.source === 'fractal_upscale';
      const src = synthetic
        ? '<span class="bad">fractal_upscale — SYNTHETIC, not real imagery</span>'
        : m.texture.source;
      return `<span class="ok">cached</span> · ${src} · ${(m.texture.bytes / 1024).toFixed(0)} kB`;
    }
  },
  {
    key: 'classifier', name: '4 classifier',
    what: 'hierarchical ladder (coarse_v2): DEM co-proposes with imagery — slope/aspect/sun/greenline gate green, flat level sheets become lake, unlit+dark is shadow (honest unknown). "raw mask" is the exact one-hot surface mask the ground-detail shader and scatter placement actually read (R=rock incl. dark as 128, G=veg, B=snow; shadow/lake stay black = nothing lives or details there).',
    select: ['colorized', 'raw mask'],
    img: (tid, mode) => mode === 'raw mask'
      ? `/api/classifier/${tid}.png?raw=1&res=${RES}`
      : `/api/classifier/${tid}.png?res=${RES}`,
    // Matches classifier/storage.py CLASS_SCHEMAS['coarse_v2'].palette
    // EXACTLY — this is a deliberate high-contrast debug palette, not
    // intuitive tones (grey reads as purple, dark as orange). A legend
    // that doesn't match the real colors makes correct output look wrong.
    legend: { grey: 'rgb(150,105,210)', green: 'rgb(150,225,60)', dark: 'rgb(255,140,0)', white: 'rgb(255,255,255)', water: 'rgb(255,42,161)', shadow: 'rgb(60,120,255)', lake: 'rgb(0,200,220)' },
    info: () => ''
  },
  {
    key: 'archetypes', name: '5 archetypes',
    what: 'NMS-style decision rung: each ~20 m cell commits to ONE landform (from classes + DEM + adjacency). Scatter recipes, stamps and talus key off the DECISION, not raw channels.',
    img: tid => `/api/archetypes/${tid}.png?res=${RES}`,
    // Matches classifier/archetypes.py ARCHETYPE_PALETTE exactly.
    legend: {
      water: 'rgb(255,42,161)', lake: 'rgb(0,200,220)', shore: 'rgb(255,230,90)',
      bench: 'rgb(110,205,60)', bog: 'rgb(120,85,40)', slab: 'rgb(168,168,178)',
      face: 'rgb(232,90,40)', talus: 'rgb(150,105,210)', ridge: 'rgb(255,255,255)',
      shadow: 'rgb(60,120,255)', snow: 'rgb(225,240,255)',
    },
    info: () => ''
  },
  {
    key: 'procgen', name: '6 procgen',
    what: 'below-d12 synthesis from archetype decisions + DEM + seed — deterministic',
    img: null,
    info: () => '<span class="bad">not built yet</span> — this is the next thing'
  },
];

function tileId() { return `${depth}-${col}-${row}`; }
function parseTile(str) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(str.trim());
  if (!m) return false;
  depth = +m[1]; col = +m[2]; row = +m[3];
  return true;
}

function buildFlow() {
  // display:contents stages: every cell carries its explicit grid column
  // (odd columns = stages, even columns = arrows) so all cells of a stage
  // stack in one column while rows stay shared across stages.
  $('flow').innerHTML = STAGES.map((s, i) => {
    const col = `style="grid-column:${2 * i + 1}"`;
    return `
    ${i ? `<div class="arrow" style="grid-column:${2 * i}">&rarr;</div>` : ''}
    <div class="stage">
      <div class="name" ${col}>${s.name}
        ${s.select ? `<select id="sel-${s.key}">${s.select.map(o => `<option>${o}</option>`).join('')}</select>` : ''}
      </div>
      <div class="imgbox" ${col}><img id="img-${s.key}" alt=""><div class="status" id="st-${s.key}"></div></div>
      ${s.legend ? `<div class="legend" ${col}>${Object.entries(s.legend).map(([n, c]) =>
        `<span class="key-item"><span class="key-swatch" style="background:${c}"></span>${n}</span>`).join('')}</div>` : ''}
      <div class="info" id="info-${s.key}" ${col}></div>
      <div class="what" ${col}>${s.what}</div>
    </div>`;
  }).join('');
  for (const s of STAGES) {
    if (s.select) $(`sel-${s.key}`).addEventListener('change', () => loadStageImage(s));
  }
}

async function loadStageImage(s, refresh) {
  const imgEl = $(`img-${s.key}`), stEl = $(`st-${s.key}`);
  if (!s.img) {
    imgEl.removeAttribute('src');
    stEl.textContent = 'nothing here yet';
    return;
  }
  const url = s.img(tileId(), s.select ? $(`sel-${s.key}`).value : null, refresh);
  stEl.textContent = 'loading…';
  imgEl.style.opacity = 0.35;
  try {
    const resp = await fetch(url);
    if (!resp.ok || resp.status === 202) {
      imgEl.removeAttribute('src');
      stEl.textContent = resp.status === 202 ? 'fetching upstream — retry shortly'
        : `HTTP ${resp.status} ${resp.headers.get('X-Tex-Status') || ''}`;
      return;
    }
    const blob = await resp.blob();
    if (imgEl.dataset.blobUrl) URL.revokeObjectURL(imgEl.dataset.blobUrl);
    imgEl.dataset.blobUrl = URL.createObjectURL(blob);
    imgEl.src = imgEl.dataset.blobUrl;
    imgEl.style.opacity = 1;
    stEl.textContent = '';
  } catch (err) {
    stEl.textContent = String(err);
  }
}

async function load() {
  const tid = tileId();
  $('tile-input').value = tid;
  const url = new URL(location);
  url.searchParams.set('tile', tid);
  history.replaceState(null, '', url);
  $('meta').textContent = `depth ${depth}`;
  let meta = null;
  try {
    const r = await fetch(`/api/pipeline/${tid}.json`);
    meta = r.ok ? await r.json() : null;
    if (meta) $('meta').textContent = `depth ${depth} · ${meta.size_m} m across`;
  } catch (e) { /* statuses degrade gracefully */ }
  for (const s of STAGES) {
    $(`info-${s.key}`).innerHTML = meta ? s.info(meta)
      : '<span class="bad">tile not in grid — never seeded</span>';
    loadStageImage(s);
  }
}

$('go').addEventListener('click', () => { if (parseTile($('tile-input').value)) load(); });
$('tile-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('go').click();
  e.stopPropagation();
});
$('up').addEventListener('click', () => {
  if (depth > 0) { depth--; col >>= 1; row >>= 1; load(); }
});
$('down').addEventListener('click', () => { depth++; col *= 2; row *= 2; load(); });

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  // grid row increases northward (same convention as the tile ancestor math)
  if (e.key === 'ArrowUp') { row++; load(); }
  else if (e.key === 'ArrowDown') { row--; load(); }
  else if (e.key === 'ArrowLeft') { col--; load(); }
  else if (e.key === 'ArrowRight') { col++; load(); }
  else if (e.key === '[') $('up').click();
  else if (e.key === ']') $('down').click();
  else return;
  e.preventDefault();
});

buildFlow();
const qs = new URLSearchParams(location.search);
const ll = qs.get('ll');   // "?ll=lat,lon" — from the 3D HUD, resolves to the tile under the camera
if (ll && /^-?[\d.]+,-?[\d.]+$/.test(ll)) {
  const [lat, lon] = ll.split(',');
  fetch(`/api/pipeline/at.json?lat=${lat}&lon=${lon}`)
    .then(r => r.json())
    .then(j => { parseTile(j.tile || '') || parseTile('12-1373-784'); load(); })
    .catch(() => { parseTile('12-1373-784'); load(); });
} else {
  const start = qs.get('tile') || '12-1373-784';
  if (parseTile(start)) load(); else { parseTile('12-1373-784'); load(); }
}
</script>
</body>
</html>
