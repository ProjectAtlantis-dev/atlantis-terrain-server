<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile Pipeline</title>
<style>
  body {
    margin: 0; background: #0a1018; color: #dbe5f1;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: rgba(255,255,255,0.05); border-bottom: 1px solid #1e2d3a;
    flex-wrap: wrap;
  }
  #bar b { color: #5af; }
  input {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 4px 8px; font: inherit; outline: none; width: 150px;
  }
  button {
    background: #1a3a5a; border: 1px solid #2a5a8a; border-radius: 4px; color: #5af;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  button:hover { background: #224a72; }
  select {
    background: rgba(255,255,255,0.07); border: 1px solid #2a3a4a; border-radius: 4px;
    color: #dbe5f1; padding: 2px 4px; font: inherit; outline: none;
  }
  #meta { color: #6889a8; }
  #flow { display: flex; gap: 4px; padding: 12px; justify-content: center; align-items: flex-start; }
  .stage {
    display: flex; flex-direction: column; gap: 5px; min-width: 0;
    width: min(15vw, calc(100vh - 170px));
  }
  .stage .name { text-align: center; color: #dbe5f1; font-weight: bold; }
  .stage .what { text-align: center; color: #44607c; font-size: 12px; line-height: 1.3; min-height: 3.9em; }
  .imgbox {
    position: relative; background: #060a10; border: 1px solid #1e2d3a;
    width: 100%; aspect-ratio: 1;
  }
  .imgbox img { width: 100%; height: 100%; display: block; }
  .imgbox .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6889a8; text-align: center; padding: 8px; pointer-events: none;
  }
  .stage .info { text-align: center; color: #8fb0cc; font-size: 12px; line-height: 1.35; word-break: break-word; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 3px 10px; justify-content: center;
    color: #8fb0cc; font-size: 12px;
  }
  .key-item { display: flex; align-items: center; gap: 5px; }
  .key-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .info .ok { color: #4cc38a; }
  .info .bad { color: #e5484d; }
  .arrow { align-self: center; color: #2a5a8a; font-size: 22px; padding: 0 2px; margin-top: 14vh; }
  #help { padding: 4px 14px 14px; color: #44607c; text-align: center; }
  kbd {
    background: #16222e; border: 1px solid #2a3a4a; border-radius: 3px;
    padding: 0 5px; color: #8fb0cc;
  }
</style>
</head>
<body>
<div id="bar">
  <b>tile pipeline</b>
  <input id="tile-input" placeholder="tile id e.g. 12-1373-784" spellcheck="false">
  <button id="go">Go</button>
  <button id="up" title="parent tile ([)">&minus; depth</button>
  <button id="down" title="child tile (])">+ depth</button>
  <button id="refresh-google" title="re-fetch the Google reference, bypassing the cache">refresh google</button>
  <button id="flag" title="add this tile to the classifier regression cases, with a note about what is wrong">&#9873; flag regression</button>
  <a href="/api/regression/" target="_blank" style="color:#5af">regression cases</a>
  <span id="meta"></span>
</div>
<div id="flow"></div>
<div id="help">
  <kbd>&larr;&uarr;&darr;&rarr;</kbd> neighbor tiles &nbsp; <kbd>[</kbd>/<kbd>]</kbd> depth up/down
</div>
<script>
const RES = 512;
let depth = 0, col = 0, row = 0;
const $ = id => document.getElementById(id);

// The pipeline, in order. Each stage: what it is, where its image comes from,
// and how to describe its status from /api/pipeline/<tid>.json.
const STAGES = [
  {
    key: 'heightmap', name: '1 heightmap',
    what: 'ArcticDEM 10 m (Copernicus 30 m fallback), fetched on demand into terrain.db',
    img: tid => `/api/channel/${tid}/elev.png?res=${RES}`,
    info: m => m.heightmap.ok
      ? `<span class="ok">cached</span> · ${m.heightmap.source || '?'}`
      : '<span class="bad">missing — fly here to fetch</span>'
  },
  {
    key: 'channels', name: '2 southness',
    what: 'aspect from the heightmap (red = south-facing, blue = north) — combines slope + sun; nothing lives on the blue side',
    img: tid => `/api/channel/${tid}/southness.png?res=${RES}`,
    info: m => m.heightmap.ok
      ? '<span class="ok">derived on the fly</span>'
      : '<span class="bad">needs the heightmap</span>'
  },
  {
    key: 'texture', name: '3 texture',
    what: 'Dataforsyningen SPOT/aerial ortho — the real imagery, faithful through d12',
    img: tid => `/api/texture/${tid}.jpg`,
    info: m => m.texture.ok
      ? `<span class="ok">cached</span> · ${m.texture.source} · ${(m.texture.bytes / 1024).toFixed(0)} kB`
      : '<span class="bad">not fetched yet</span>'
  },
  {
    key: 'google', name: '4 google ref',
    what: 'labeling reference only — sharper imagery that grades our classes; never shipped',
    img: (tid, _o, refresh) => `/api/google/${tid}.jpg?res=${RES}${refresh ? '&refresh=1' : ''}`,
    info: m => m.google_ref.ok
      ? `<span class="ok">cached</span> · z${m.google_ref.zoom} · ${(m.google_ref.bytes / 1024).toFixed(0)} kB`
      : 'not cached — first view fetches'
  },
  {
    key: 'buckets', name: '5 buckets',
    what: 'what goes where: water / grey / dark / green / white — the contract procgen paints from',
    img: tid => `/api/classes/${tid}/coarse.png?res=${RES}`,
    legend: { grey: '#9669d2', green: '#96e13c', dark: '#ff8c00', white: '#ffffff', water: '#285aff' },
    info: m => (m.heightmap.ok
      ? '<span class="ok">computed from google + DEM</span>'
      : 'computed from google only (no DEM gates)')
  },
  {
    key: 'procgen', name: '6 procgen',
    what: 'below-d12 synthesis: invented detail from buckets + DEM + seed — gorgeous, deterministic',
    img: null,
    info: () => '<span class="bad">not built yet</span> — this is the next thing'
  },
];

function tileId() { return `${depth}-${col}-${row}`; }
function parseTile(str) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(str.trim());
  if (!m) return false;
  depth = +m[1]; col = +m[2]; row = +m[3];
  return true;
}

function buildFlow() {
  $('flow').innerHTML = STAGES.map((s, i) => `
    ${i ? '<div class="arrow">&rarr;</div>' : ''}
    <div class="stage">
      <div class="name">${s.name}
        ${s.select ? `<select id="sel-${s.key}">${s.select.map(o => `<option>${o}</option>`).join('')}</select>` : ''}
      </div>
      <div class="what">${s.what}</div>
      <div class="imgbox"><img id="img-${s.key}" alt=""><div class="status" id="st-${s.key}"></div></div>
      ${s.legend ? `<div class="legend">${Object.entries(s.legend).map(([n, c]) =>
        `<span class="key-item"><span class="key-swatch" style="background:${c}"></span>${n}</span>`).join('')}</div>` : ''}
      <div class="info" id="info-${s.key}"></div>
    </div>`).join('');
  for (const s of STAGES) {
    if (s.select) $(`sel-${s.key}`).addEventListener('change', () => loadStageImage(s));
  }
}

async function loadStageImage(s, refresh) {
  const imgEl = $(`img-${s.key}`), stEl = $(`st-${s.key}`);
  if (!s.img) {
    imgEl.removeAttribute('src');
    stEl.textContent = 'nothing here yet';
    return;
  }
  const url = s.img(tileId(), s.select ? $(`sel-${s.key}`).value : null, refresh);
  stEl.textContent = 'loading…';
  imgEl.style.opacity = 0.35;
  try {
    const resp = await fetch(url);
    if (!resp.ok || resp.status === 202) {
      imgEl.removeAttribute('src');
      stEl.textContent = resp.status === 202 ? 'fetching upstream — retry shortly'
        : `HTTP ${resp.status} ${resp.headers.get('X-Tex-Status') || ''}`;
      return;
    }
    const blob = await resp.blob();
    if (imgEl.dataset.blobUrl) URL.revokeObjectURL(imgEl.dataset.blobUrl);
    imgEl.dataset.blobUrl = URL.createObjectURL(blob);
    imgEl.src = imgEl.dataset.blobUrl;
    imgEl.style.opacity = 1;
    stEl.textContent = '';
  } catch (err) {
    stEl.textContent = String(err);
  }
}

async function load() {
  const tid = tileId();
  $('tile-input').value = tid;
  const url = new URL(location);
  url.searchParams.set('tile', tid);
  history.replaceState(null, '', url);
  $('meta').textContent = `depth ${depth}`;
  let meta = null;
  try {
    const r = await fetch(`/api/pipeline/${tid}.json`);
    meta = r.ok ? await r.json() : null;
    if (meta) $('meta').textContent = `depth ${depth} · ${meta.size_m} m across`;
  } catch (e) { /* statuses degrade gracefully */ }
  for (const s of STAGES) {
    $(`info-${s.key}`).innerHTML = meta ? s.info(meta)
      : '<span class="bad">tile not in grid — never seeded</span>';
    loadStageImage(s);
  }
}

$('go').addEventListener('click', () => { if (parseTile($('tile-input').value)) load(); });
$('refresh-google').addEventListener('click', () => {
  const g = STAGES.find(s => s.key === 'google');
  loadStageImage(g, true);
  // buckets classify off the google ref — recompute them too
  loadStageImage(STAGES.find(s => s.key === 'buckets'));
});
$('flag').addEventListener('click', async () => {
  const note = prompt(`What is wrong on tile ${tileId()}? (one line — becomes the regression note)`);
  if (!note || !note.trim()) return;
  $('meta').textContent = 'flagging + baking regression case…';
  try {
    const resp = await fetch('/api/regression/cases', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tile: tileId(), note: note.trim() })
    });
    const j = await resp.json().catch(() => ({}));
    $('meta').textContent = resp.ok
      ? `flagged ${tileId()} — ${j.cases} case${j.cases === 1 ? '' : 's'} total`
      : `flag failed: ${j.error || `HTTP ${resp.status}`}`;
  } catch (err) {
    $('meta').textContent = `flag failed: ${err}`;
  }
});
$('tile-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('go').click();
  e.stopPropagation();
});
$('up').addEventListener('click', () => {
  if (depth > 0) { depth--; col >>= 1; row >>= 1; load(); }
});
$('down').addEventListener('click', () => { depth++; col *= 2; row *= 2; load(); });

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  // grid row increases northward (same convention as the tile ancestor math)
  if (e.key === 'ArrowUp') { row++; load(); }
  else if (e.key === 'ArrowDown') { row--; load(); }
  else if (e.key === 'ArrowLeft') { col--; load(); }
  else if (e.key === 'ArrowRight') { col++; load(); }
  else if (e.key === '[') $('up').click();
  else if (e.key === ']') $('down').click();
  else return;
  e.preventDefault();
});

buildFlow();
const qs = new URLSearchParams(location.search);
const ll = qs.get('ll');   // "?ll=lat,lon" — from the 3D HUD, resolves to the tile under the camera
if (ll && /^-?[\d.]+,-?[\d.]+$/.test(ll)) {
  const [lat, lon] = ll.split(',');
  fetch(`/api/pipeline/at.json?lat=${lat}&lon=${lon}`)
    .then(r => r.json())
    .then(j => { parseTile(j.tile || '') || parseTile('12-1373-784'); load(); })
    .catch(() => { parseTile('12-1373-784'); load(); });
} else {
  const start = qs.get('tile') || '12-1373-784';
  if (parseTile(start)) load(); else { parseTile('12-1373-784'); load(); }
}
</script>
</body>
</html>
